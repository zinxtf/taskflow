<html lang="en">

<body class="bg-zinc-950 text-white min-h-screen">
<div class="max-w-3xl mx-auto p-6">
<header class="flex justify-between items-center py-6">
<h1 class="text-2xl font-bold">TaskFlow</h1>

<button onclick="addTask()" class="bg-white text-black px-6 rounded-xl font-bold">Add</button>
</div>
<div id="list" class="mt-6 space-y-3"></div>
<div class="mt-10 text-center text-zinc-500 text-xs">Live Demo: vitejs-vite-duplicat-ijws.bolt.host<br>Built with Bolt.new + GitHub Pages</div>
</div>
<script>

function save(){localStorage.setItem('tf',JSON.stringify(tasks))}
